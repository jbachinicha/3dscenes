<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline Drive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #fce8f4; font-family: Georgia, serif; }
    canvas { display: block; }

    #back {
      position: fixed; top: 20px; left: 22px; z-index: 5;
      color: rgba(200, 90, 135, 0.95); font-size: 14px; letter-spacing: 0.04em;
      text-decoration: none; padding: 7px 14px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(200, 90, 135, 0.22);
      backdrop-filter: blur(6px); transition: background 0.18s ease, transform 0.18s ease;
    }
    #back:hover { background: rgba(255,255,255,0.9); transform: translateY(-1px); }
    #back:focus-visible { outline: 2px solid rgba(200,90,135,0.7); outline-offset: 3px; }

    #hud {
      position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
      z-index: 4; text-align: center; pointer-events: none;
      color: rgba(170, 70, 110, 0.9); font-size: 13px; letter-spacing: 0.06em;
      text-shadow: 0 1px 6px rgba(255,220,235,0.9);
    }

    /* Caption panel that fades in as you pull up to a frame */
    #caption {
      /* Top of screen: the joystick occupies the bottom-left on touch, and the
         back button / loading pill sit above at top: 20px. */
      position: fixed; left: 50%; top: 74px; transform: translateX(-50%) translateY(-14px);
      z-index: 4; pointer-events: none; opacity: 0;
      transition: opacity 0.45s ease, transform 0.45s ease;
      background: rgba(255, 252, 248, 0.9);
      border: 1px solid rgba(200, 90, 135, 0.2);
      border-radius: 18px; padding: 15px 26px 17px;
      box-shadow: 0 10px 30px rgba(200, 120, 160, 0.22);
      backdrop-filter: blur(8px);
      max-width: min(90vw, 460px); text-align: center;
    }
    #caption.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #caption .date {
      font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(200, 90, 135, 0.75); margin-bottom: 6px;
    }
    #caption .text { font-size: 17px; line-height: 1.5; color: #7d4b60; }

    /* Intro card, dismissed on first input */
    #intro {
      position: fixed; inset: 0; z-index: 6; display: grid; place-items: center;
      background: rgba(252, 232, 244, 0.72); backdrop-filter: blur(10px);
      transition: opacity 0.6s ease; text-align: center; padding: 24px;
    }
    #intro.hide { opacity: 0; pointer-events: none; }
    #intro .card {
      background: rgba(255, 252, 248, 0.95); border-radius: 26px;
      border: 1px solid rgba(200, 90, 135, 0.18);
      box-shadow: 0 20px 60px rgba(200, 120, 160, 0.28);
      padding: 44px 46px 40px; max-width: 470px;
    }
    #intro h1 { font-size: 30px; font-weight: normal; color: #8a4f66; letter-spacing: 0.01em; }
    #intro p { margin-top: 14px; font-size: 15px; line-height: 1.65; color: #a1758a; }
    #intro .keys { margin-top: 22px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    #intro kbd {
      font-family: inherit; font-size: 12px; color: #9c5f78;
      background: rgba(200, 90, 135, 0.08); border: 1px solid rgba(200, 90, 135, 0.2);
      border-radius: 7px; padding: 5px 10px;
    }
    #intro .go { margin-top: 26px; font-size: 13px; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(200, 90, 135, 0.8); }

    @media (prefers-reduced-motion: reduce) {
      #back, #caption, #intro { transition: none; }
    }

    /* Spinner shown while photos are still downloading */
    #loading {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 5; display: flex; align-items: center; gap: 9px;
      padding: 7px 15px 7px 11px; border-radius: 999px;
      background: rgba(255, 252, 248, 0.82);
      border: 1px solid rgba(200, 90, 135, 0.22);
      box-shadow: 0 6px 20px rgba(200, 120, 160, 0.18);
      backdrop-filter: blur(6px);
      color: rgba(170, 70, 110, 0.9); font-size: 12px; letter-spacing: 0.06em;
      pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
    }
    #loading.show { opacity: 1; }
    #loading .ring {
      width: 15px; height: 15px; border-radius: 999px;
      border: 2px solid rgba(200, 90, 135, 0.25);
      border-top-color: rgba(200, 90, 135, 0.95);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #loading .ring { animation-duration: 2.4s; }
    }

    /* On-screen driving controls — shown only on touch devices (see JS below) */
    #touchControls { display: none; }
    body.touch #hud { display: none; }
    body.touch #touchControls { display: block; }

    #touchControls {
      position: fixed; inset: 0; z-index: 4; pointer-events: none;
      /* Keep clear of home-indicator / notch areas */
      padding: 0 max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }
    /* Virtual joystick: a fixed base with a thumb knob that follows the drag */
    #stick {
      position: absolute; bottom: 26px; left: 26px;
      width: 132px; height: 132px; border-radius: 999px;
      pointer-events: auto; touch-action: none;
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(200, 90, 135, 0.26);
      backdrop-filter: blur(6px);
    }
    /* Faint cross-hair so the neutral centre reads at a glance */
    #stick::before, #stick::after {
      content: ''; position: absolute; background: rgba(200, 90, 135, 0.16);
    }
    #stick::before { left: 50%; top: 18%; width: 1px; height: 64%; transform: translateX(-50%); }
    #stick::after { top: 50%; left: 18%; height: 1px; width: 64%; transform: translateY(-50%); }

    #stickKnob {
      position: absolute; left: 50%; top: 50%;
      width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 999px;
      background: rgba(255, 173, 212, 0.9);
      border: 1px solid rgba(216, 96, 140, 0.45);
      box-shadow: 0 4px 14px rgba(200, 120, 160, 0.35);
      transition: background 0.12s ease;
      will-change: transform;
    }
    #stick.active #stickKnob { background: rgba(216, 96, 140, 0.95); }

    #touchControls button {
      -webkit-tap-highlight-color: transparent; touch-action: none;
      /* iOS Safari needs the prefixed forms, or a long press still selects the
         label text and pops the callout menu mid-drive. */
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none;
      width: 56px; height: 56px; border-radius: 16px; font-size: 20px;
      color: rgba(170, 70, 110, 0.95);
      background: rgba(255, 255, 255, 0.55); border: 1px solid rgba(200, 90, 135, 0.28);
      backdrop-filter: blur(6px); display: grid; place-items: center;
      transition: background 0.12s ease, transform 0.12s ease;
    }
    #touchControls button:active,
    #touchControls button.held { background: rgba(255, 173, 212, 0.85); transform: scale(0.94); }

    #brakeBtn {
      position: absolute; bottom: 26px; right: 18px; pointer-events: auto;
      width: 76px; height: 76px; border-radius: 999px; font-size: 12px;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    #turboBtn {
      position: absolute; bottom: 112px; right: 26px; pointer-events: auto;
      width: 60px; height: 60px; border-radius: 999px; font-size: 11px;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: rgba(255, 250, 255, 0.95);
      background: rgba(255, 133, 179, 0.75); border: 1px solid rgba(216, 96, 140, 0.5);
    }
    #turboBtn.held { background: rgba(216, 96, 140, 0.95); }
    #resetBtn {
      position: absolute; top: 20px; right: 18px; pointer-events: auto;
      width: 46px; height: 46px; border-radius: 999px; font-size: 15px;
    }
  </style>
</head>
<body>
<a id="back" href="../../">&larr; all scenes</a>

<div id="loading"><div class="ring"></div><span id="loadingText">loading photos</span></div>

<div id="caption"><div class="date"></div><div class="text"></div></div>
<div id="hud">W A S D / arrows to drive &nbsp;•&nbsp; shift for turbo &nbsp;•&nbsp; space to brake &nbsp;•&nbsp; drag to look &nbsp;•&nbsp; R to reset</div>

<div id="touchControls">
  <div id="stick" role="application" aria-label="Drive joystick"><div id="stickKnob"></div></div>
  <button id="brakeBtn" aria-label="Brake">BRAKE</button>
  <button id="turboBtn" aria-label="Turbo">TURBO</button>
  <button id="resetBtn" aria-label="Reset car">&#8635;</button>
</div>

<div id="intro">
  <div class="card">
    <h1 id="introTitle"></h1>
    <p id="introSub"></p>
    <div class="keys">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>shift</kbd><kbd>space</kbd><kbd>R</kbd>
    </div>
    <div class="go">press any key to begin</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import RAPIER from '@dimforge/rapier3d-compat';
import { TITLE, SUBTITLE, ENDING, MOMENTS } from './moments.js';

// Your dates, captions and photo paths live in moments.js — edit that file.
document.getElementById('introTitle').textContent = TITLE;
document.getElementById('introSub').textContent = SUBTITLE;

// ── Palette (shared with the island scene) ─────────────────────────────────
const C = {
  sky:    0xfce8f4,
  grass:  0x9fd3b0,
  grass2: 0x8ec7a2,
  road:   0xfff2ea,
  kerb:   0xffd3e6,
  cream:  0xfff7ee,
  blush:  0xffadd4,
  pink:   0xff85b3,
  rose:   0xd8608c,
  mint:   0x7ecfa4,
  lilac:  0xd9b8f0,
  bark:   0x9a6840,
  wheel:  0x5c4a52,
};

// ── Renderer / scene / camera ────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.sky);
scene.fog = new THREE.Fog(C.sky, 70, 300);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 6, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI / 2.15;
controls.enablePan = false;

scene.add(new THREE.AmbientLight(0xffeef8, 1.0));
const sun = new THREE.DirectionalLight(0xfff6e6, 1.32);
sun.position.set(14, 24, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
// Tight shadow frustum that follows the car, so shadows stay crisp on a long road
Object.assign(sun.shadow.camera, { near: 1, far: 90, left: -22, right: 22, top: 22, bottom: -22 });
sun.shadow.bias = -0.0012;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xd8d0ff, 0.28);
fill.position.set(-12, 10, -8);
scene.add(fill);

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

// ── Canvas-texture helpers ──────────────────────────────────────────────────
function textTexture(text, { w = 512, h = 148, font = '600 56px Georgia, serif',
                             bg = '#fff7ee', fg = '#c2607f' } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.fillStyle = fg; g.font = font;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, w / 2, h / 2 + 2);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

// Stand-in for a photo that has not been added yet
function placeholderTexture(n) {
  const w = 600, h = 400;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, w, h);
  const pairs = [['#ffd9ea', '#d8ecff'], ['#ffe4d2', '#ffd9ea'], ['#dff2e3', '#ffe9f4'], ['#e8dcff', '#d9f0ea']];
  const [a, b] = pairs[(n - 1) % pairs.length];
  grad.addColorStop(0, a); grad.addColorStop(1, b);
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(150,80,115,0.8)';
  g.font = '600 130px Georgia, serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(String(n).padStart(2, '0'), w / 2, h / 2 - 18);
  g.font = '300 24px Georgia, serif';
  g.fillStyle = 'rgba(150,80,115,0.75)';
  g.fillText('add your photo', w / 2, h / 2 + 62);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const texLoader = new THREE.TextureLoader();

// Photos here are multi-megabyte, so show a spinner until they are all in.
// Counting settled loads rather than listening per-texture keeps it correct
// when some files 404 — a failed load still has to clear the counter.
const loadingEl = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
let pending = 0, totalPhotos = 0;
function photoStarted() {
  pending++; totalPhotos++;
  updateLoading();
}
function photoSettled() {
  pending--;
  updateLoading();
}
function updateLoading() {
  if (pending > 0) {
    loadingEl.classList.add('show');
    loadingText.textContent = `loading photos ${totalPhotos - pending}/${totalPhotos}`;
  } else {
    loadingEl.classList.remove('show');
  }
}

// Straight off a phone, a photo can be 48 megapixels — which costs ~260 MB of
// GPU memory once mipmapped. A handful of those and the browser kills the tab,
// so anything oversized is redrawn at a sane size before it reaches the GPU.
// The frames are small on screen; 1600px is far more than they can show.
const MAX_PHOTO_PX = 1600;
function fitTexture(tex) {
  const img = tex.image;
  const longest = Math.max(img.width, img.height);
  if (longest <= MAX_PHOTO_PX) return tex;
  const k = MAX_PHOTO_PX / longest;
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k);
  c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  tex.dispose();
  return new THREE.CanvasTexture(c);
}

// Resolve to the photo when it exists, otherwise a placeholder — so the scene
// looks finished before any images are dropped in.
function photoMaterial(path, index) {
  const mat = new THREE.MeshBasicMaterial({ map: placeholderTexture(index + 1) });
  if (path) {
    photoStarted();
    texLoader.load(
      '../../' + path,
      (loaded) => {
        const tex = fitTexture(loaded);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        mat.map = tex;
        mat.needsUpdate = true;
        photoSettled();
      },
      undefined,
      () => { photoSettled(); /* keep the placeholder */ }
    );
  }
  return mat;
}

// ── Physics ─────────────────────────────────────────────────────────────────
await RAPIER.init();
const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
world.timestep = 1 / 60;

// Ground: one big flat slab, so the road is dead level and driving stays stable
world.createCollider(
  RAPIER.ColliderDesc.cuboid(400, 0.5, 400).setTranslation(0, -0.5, 0).setFriction(1.4),
  world.createRigidBody(RAPIER.RigidBodyDesc.fixed())
);

// ── Ground visuals ──────────────────────────────────────────────────────────
function grassTexture() {
  const N = 64, c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  g.fillStyle = '#9fd3b0'; g.fillRect(0, 0, N, N);
  for (let i = 0; i < 900; i++) {
    g.fillStyle = `rgba(${130 + Math.random() * 45},${185 + Math.random() * 35},${150 + Math.random() * 35},0.55)`;
    g.fillRect(Math.random() * N, Math.random() * N, 1.5, 1.5);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(230, 230);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(800, 800),
  new THREE.MeshLambertMaterial({ map: grassTexture() })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ── The road: a gently winding ribbon the frames line up along ─────────────
const SPAN = 34;                       // spacing between moments
const LEAD = 26;                       // runway before the first frame
const TAIL = 30;                       // run-out after the last
const roadPts = [];
{
  const total = LEAD + SPAN * (MOMENTS.length - 1) + TAIL;
  for (let z = -LEAD, i = 0; z <= total - LEAD; z += 10, i++) {
    // A lazy S so the drive is never a straight corridor
    roadPts.push(new THREE.Vector3(Math.sin(z * 0.021) * 11 + Math.sin(z * 0.007) * 5, 0, z));
  }
}
const roadCurve = new THREE.CatmullRomCurve3(roadPts, false, 'catmullrom', 0.4);
const ROAD_LEN = roadCurve.getLength();

// Sample the curve once; everything else positions itself off these frames
function roadFrame(t) {
  const p = roadCurve.getPointAt(THREE.MathUtils.clamp(t, 0, 1));
  const tan = roadCurve.getTangentAt(THREE.MathUtils.clamp(t, 0, 1));
  const right = new THREE.Vector3(tan.z, 0, -tan.x).normalize();
  return { p, tan, right };
}

function ribbon(halfWidth, y, color, { steps = 420 } = {}) {
  const pos = [], idx = [];
  for (let i = 0; i <= steps; i++) {
    const { p, right } = roadFrame(i / steps);
    const l = p.clone().addScaledVector(right, -halfWidth);
    const r = p.clone().addScaledVector(right, halfWidth);
    pos.push(l.x, y, l.z, r.x, y, r.z);
    if (i < steps) {
      const a = i * 2;
      idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color }));
  mesh.receiveShadow = true;
  return mesh;
}
scene.add(ribbon(5.1, 0.012, C.kerb));   // soft shoulder
scene.add(ribbon(4.3, 0.02, C.road));    // carriageway

// Dashed centre line
for (let i = 0; i < 82; i++) {
  const t = i / 82;
  const { p, tan } = roadFrame(t);
  const dash = new THREE.Mesh(
    new THREE.PlaneGeometry(0.2, 2.3),
    new THREE.MeshBasicMaterial({ color: 0xffc2da })
  );
  dash.rotation.x = -Math.PI / 2;
  dash.rotation.z = -Math.atan2(tan.x, tan.z);
  dash.position.set(p.x, 0.026, p.z);
  scene.add(dash);
}

// ── Decor ───────────────────────────────────────────────────────────────────
function makeTree(x, z, sc) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.09 * sc, 0.13 * sc, 0.8 * sc, 7),
    new THREE.MeshLambertMaterial({ color: C.bark })
  );
  trunk.position.y = 0.4 * sc; trunk.castShadow = true;
  g.add(trunk);
  const leafMat = new THREE.MeshLambertMaterial({
    color: pick([0x7ecfa4, 0x94dab4, 0xb0e8c4, 0xa8dcc0]),
  });
  for (let i = 0; i < 3; i++) {
    const b = new THREE.Mesh(new THREE.SphereGeometry((0.34 + i * 0.06) * sc, 9, 7), leafMat);
    b.position.set(rnd(-0.16, 0.16) * sc, (0.85 + i * 0.3) * sc, rnd(-0.16, 0.16) * sc);
    b.castShadow = true;
    g.add(b);
  }
  g.position.set(x, 0, z);
  return g;
}

function makeFlower(x, z) {
  const g = new THREE.Group();
  const sc = rnd(0.8, 1.3);
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.02 * sc, 0.028 * sc, 0.42 * sc, 6),
    new THREE.MeshLambertMaterial({ color: 0x5aad72 })
  );
  stem.position.y = 0.21 * sc;
  g.add(stem);
  const petalMat = new THREE.MeshLambertMaterial({
    color: pick([0xffadd4, 0xffbfe4, 0xff9ec8, 0xffdce8, 0xe8b0ff, 0xffccaa]),
  });
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const petal = new THREE.Mesh(new THREE.SphereGeometry(0.075 * sc, 7, 5), petalMat);
    petal.position.set(Math.cos(a) * 0.1 * sc, 0.44 * sc, Math.sin(a) * 0.1 * sc);
    petal.scale.set(1, 0.45, 1);
    g.add(petal);
  }
  const mid = new THREE.Mesh(
    new THREE.SphereGeometry(0.045 * sc, 7, 5),
    new THREE.MeshLambertMaterial({ color: 0xffd76a })
  );
  mid.position.y = 0.46 * sc;
  g.add(mid);
  g.position.set(x, 0, z);
  return g;
}

// Scatter décor to the sides of the road, never on it
const treeBodies = [];
for (let i = 0; i < 190; i++) {
  const t = Math.random();
  const { p, right } = roadFrame(t);
  const side = Math.random() < 0.5 ? -1 : 1;
  const off = rnd(9, 46) * side;
  const x = p.x + right.x * off + rnd(-3, 3);
  const z = p.z + right.z * off + rnd(-3, 3);
  if (Math.random() < 0.45) {
    const sc = rnd(0.8, 1.5);
    scene.add(makeTree(x, z, sc));
    // Solid, so the world does not feel like a painted backdrop
    const rb = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(x, 0.8 * sc, z));
    world.createCollider(RAPIER.ColliderDesc.cylinder(0.8 * sc, 0.16 * sc), rb);
    treeBodies.push(rb);
  } else {
    scene.add(makeFlower(x, z));
  }
}

// Rolling hills far off, purely visual
for (let i = 0; i < 26; i++) {
  const t = Math.random();

// ── Photo frames ────────────────────────────────────────────────────────────
const frames = [];
const photoMeshes = [];   // every clickable photo/print mesh, for raycasting
MOMENTS.forEach((m, i) => {
  // Distance along the road for this moment, converted to a curve parameter
  const dist = LEAD + i * SPAN;
  const t = THREE.MathUtils.clamp(dist / ROAD_LEN, 0, 1);
  const { p, right, tan } = roadFrame(t);
  const side = i % 2 === 0 ? 1 : -1;          // alternate banks
  const base = p.clone().addScaledVector(right, 7.2 * side);

  const g = new THREE.Group();
  g.position.copy(base);
  // Face back the way the car arrives from, so the mount faces the camera
  // as you approach instead of facing sideways at the road.
  g.rotation.y = Math.atan2(-tan.x, -tan.z);

  // Posts
  for (const dx of [-1.5, 1.5]) {
    const post = new THREE.Mesh(
      new THREE.CylinderGeometry(0.11, 0.13, 2.0, 8),
      new THREE.MeshLambertMaterial({ color: C.cream })
    );
    post.position.set(dx, 1.0, 0);
    post.castShadow = true;
    g.add(post);
  }

  // Mount + photo(s) — a gallery post (m.photos) fans several prints across
  // one wide mount instead of a single centred photo.
  const zoomTargets = [];
  const isGallery = Array.isArray(m.photos) && m.photos.length > 0;
  const mountWidth = isGallery ? Math.max(4.0, 1.7 + m.photos.length * 1.15) : 4.0;

  const mount = new THREE.Mesh(
    new THREE.BoxGeometry(mountWidth, 2.9, 0.22),
    new THREE.MeshLambertMaterial({ color: C.cream })
  );
  mount.position.set(0, 3.05, 0);
  mount.castShadow = true;
  g.add(mount);

  if (isGallery) {
    const n = m.photos.length;
    const spread = Math.min(1.05 * (n - 1), mountWidth - 1.5);
    const cluster = [];   // every print in this gallery post, for "bring to front"
    m.photos.forEach((path, pi) => {
      const fx = n === 1 ? 0 : THREE.MathUtils.lerp(-spread / 2, spread / 2, pi / (n - 1));
      const fanAngle = n === 1 ? 0 : THREE.MathUtils.lerp(0.22, -0.22, pi / (n - 1));
      const print = new THREE.Mesh(
        new THREE.PlaneGeometry(1.7, 1.35),
        photoMaterial(path, i * 10 + pi)
      );
      // Each print sits a bit further forward than the last, so overlapping
      // fanned prints don't share a depth value and z-fight/flicker.
      print.position.set(fx, 3.02 + (n > 1 ? (pi % 2 === 0 ? 0.1 : -0.06) : 0.1), 0.13 + pi * 0.05);
      print.rotation.z = fanAngle;
      // A slim frame behind each print, so it reads as a photo, not a decal
      const border = new THREE.Mesh(
        new THREE.PlaneGeometry(1.86, 1.51),
        new THREE.MeshLambertMaterial({ color: 0xffffff, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
      );
      border.position.copy(print.position);
      border.position.z -= 0.03;
      border.rotation.z = fanAngle;
      g.add(border, print);
      zoomTargets.push(print);
      // While zoomed into this gallery, clicking a covered print brings it to
      // the front instead of exiting the zoom — see bringToFront().
      print.userData.border = border;
      print.userData.cluster = cluster;
      cluster.push(print);
    });
  } else {
    const photo = new THREE.Mesh(new THREE.PlaneGeometry(3.45, 2.3), photoMaterial(m.photo, i));
    photo.position.set(0, 3.12, 0.13);
    g.add(photo);
    zoomTargets.push(photo);
  }

  // Ribbon trim along the top of the mount
  const trim = new THREE.Mesh(
    new THREE.BoxGeometry(4.25, 0.2, 0.34),
    new THREE.MeshLambertMaterial({ color: side > 0 ? C.blush : C.lilac })
  );
  trim.position.set(0, 4.6, 0.02);
  g.add(trim);

  // Date plaque
  const plaque = new THREE.Mesh(
    new THREE.BoxGeometry(2.0, 0.56, 0.12),
    new THREE.MeshLambertMaterial({ map: textTexture(m.date, { font: '600 52px Georgia, serif' }) })
  );
  plaque.position.set(0, 1.62, 0.16);
  g.add(plaque);

  // A little heart finial
  const heart = new THREE.Mesh(
    new THREE.SphereGeometry(0.17, 8, 6),
    new THREE.MeshLambertMaterial({ color: C.pink })
  );
  heart.position.set(0, 4.86, 0);
  heart.scale.set(1, 0.85, 0.7);
  g.add(heart);

  scene.add(g);
  frames.push({ group: g, world: base.clone().setY(3), ...m });
  for (const mesh of zoomTargets) {
    mesh.userData.zoomTarget = true;
    photoMeshes.push(mesh);
  }
});

// Load the flame model once, clone it into each exhaust slot. The mesh was
// modelled in Blender pointing along -Z already (see flame.py), matching
// this car's rear-facing exhaust, so no extra rotation is needed here.
{
  const flameLoader = new GLTFLoader();
  flameLoader.setMeshoptDecoder(MeshoptDecoder);
  flameLoader.load('../../objects/turbo-flame/flame.glb', (gltf) => {
    for (const f of turboFlames) {
      const model = gltf.scene.clone(true);
      model.traverse((child) => {
        if (!child.isMesh) return;
        child.material = child.material.clone();
        child.material.transparent = true;
        child.material.depthWrite = false;
        child.material.blending = THREE.AdditiveBlending;
        child.material.opacity = 0;
        if (child.material.name === 'flameInner') f.inner = child;
        else f.outer = child;
      });
      f.group.add(model);
    }
  });
}

// Virtual joystick. Unlike the keyboard it reports how far it is pushed, so
// `stickX` / `stickY` are -1..1 and the drive loop reads them as analog
// throttle and steering rather than as on/off keys.
let stickX = 0, stickY = 0;
{
  const stick = document.getElementById('stick');
  const knob = document.getElementById('stickKnob');
  const RADIUS = 46;        // how far the knob travels from centre, in px
  const DEADZONE = 0.14;    // ignore tiny wobbles so it can rest at neutral
  let stickId = null;       // pointerId of the finger owning the stick

  const setKnob = (dx, dy) => { knob.style.transform = `translate(${dx}px, ${dy}px)`; };

  function update(e) {
    const r = stick.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2);
    let dy = e.clientY - (r.top + r.height / 2);
    // Clamp to the base circle so the knob cannot be flung outside it
    const len = Math.hypot(dx, dy);
    if (len > RADIUS) { dx = (dx / len) * RADIUS; dy = (dy / len) * RADIUS; }
    setKnob(dx, dy);

    const nx = dx / RADIUS, ny = dy / RADIUS;
    stickX = Math.abs(nx) < DEADZONE ? 0 : nx;
    stickY = Math.abs(ny) < DEADZONE ? 0 : ny;
  }

  function release() {
    stickId = null;
    stickX = stickY = 0;
    setKnob(0, 0);
    stick.classList.remove('active');
  }

  stick.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    stickId = e.pointerId;
    stick.setPointerCapture(e.pointerId);   // keep tracking if the finger slides off
    stick.classList.add('active');
    dismissIntro();
    if (zoomedMesh || zoomAnim) endZoom();
    update(e);
  });
  stick.addEventListener('pointermove', (e) => {
    if (e.pointerId !== stickId) return;
    e.preventDefault();
    update(e);
  });
  ['pointerup', 'pointercancel'].forEach((ev) =>
    stick.addEventListener(ev, (e) => {
      if (e.pointerId !== stickId) return;
      e.preventDefault();
      release();
    })
  );
}

function resetCar() {
  chassisBody.setTranslation({ x: START.x, y: START.y, z: START.z }, true);
  chassisBody.setRotation({ x: 0, y: 0, z: 0, w: 1 }, true);
  chassisBody.setLinvel({ x: 0, y: 0, z: 0 }, true);
  chassisBody.setAngvel({ x: 0, y: 0, z: 0 }, true);

  // Snap the chase camera back too — otherwise next frame's follow-delta
  // jumps from wherever the car used to be to START in a single frame, and
  // any in-progress photo zoom is left pointing at a post the car just left.
  zoomedMesh = null;
  zoomAnim = null;
  controls.enabled = true;
  carPos.copy(START);
  camTarget.copy(START);
  camera.position.set(START.x, START.y + 5, START.z - 11);
  controls.target.copy(camTarget);
  flipSince = null;
}

// ── Click-to-zoom on photos ─────────────────────────────────────────────────
// Click any photo (single frame or a print in a gallery cluster) to fly the
// camera in close; click again / click elsewhere / Esc to pull back out.
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const ZOOM_DIST = 3.2;
const ZOOM_DUR = 550; // ms
const easeInOutCubic = (x) => x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2;

let zoomedMesh = null;   // the mesh currently zoomed into, or null
let zoomAnim = null;     // in-flight transition: { from, to, start, exiting }
let savedOffset = null;  // camera offset from the car, restored on zoom-out

function meshWorldPose(mesh) {
  const pos = new THREE.Vector3();
  mesh.getWorldPosition(pos);
  const normal = new THREE.Vector3(0, 0, 1)
    .applyQuaternion(mesh.getWorldQuaternion(new THREE.Quaternion()))
    .normalize();
  return { pos, normal };
}

function startZoom(mesh) {
  const wasZoomed = !!zoomedMesh;
  const { pos, normal } = meshWorldPose(mesh);
  // Only capture the resume-to-driving offset on the *first* zoom-in — a
  // re-focus onto another print in the same cluster must not overwrite it
  // with an offset measured from the current (already zoomed-in) camera.
  if (!wasZoomed) savedOffset = camera.position.clone().sub(camTarget);
  zoomAnim = {
    from: { pos: camera.position.clone(), target: controls.target.clone() },
    to: { pos: pos.clone().addScaledVector(normal, ZOOM_DIST), target: pos.clone() },
    start: performance.now(),
    exiting: false,
  };
  zoomedMesh = mesh;
  controls.enabled = false;
}

function endZoom() {
  if (!zoomedMesh && !zoomAnim) return;
  zoomAnim = {
    from: { pos: camera.position.clone(), target: controls.target.clone() },
    to: null, // resolved live from the car's current position each frame
    start: performance.now(),
    exiting: true,
  };
  zoomedMesh = null;
}

// Raise a covered print above the rest of its gallery cluster, so clicking
// through a fanned stack surfaces whichever photo you actually want to see.
function bringToFront(print) {
  const cluster = print.userData.cluster;
  if (!cluster) return;
  const maxZ = Math.max(...cluster.map((m) => m.position.z));
  if (print.position.z < maxZ) {
    print.position.z = maxZ + 0.05;
    if (print.userData.border) print.userData.border.position.z = print.position.z - 0.03;
  }
}

function handlePointerClick(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.set(
    ((clientX - rect.left) / rect.width) * 2 - 1,
    -((clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(pointerNDC, camera);
  if (zoomedMesh || (zoomAnim && !zoomAnim.exiting)) {
    // Already zoomed into a gallery print: clicking another print in the same
    // cluster brings it to the front and re-focuses instead of backing out.
    const cluster = zoomedMesh?.userData.cluster;
    if (cluster) {
      const hit = raycaster.intersectObjects(cluster, false)[0];
      if (hit && hit.object !== zoomedMesh) { bringToFront(hit.object); startZoom(hit.object); return; }
    }
    endZoom();
    return;
  }
  const hit = raycaster.intersectObjects(photoMeshes, false)[0];
  if (hit) { dismissIntro(); startZoom(hit.object); }
}

let pointerDownAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownAt = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDownAt) return;
  const dx = e.clientX - pointerDownAt.x, dy = e.clientY - pointerDownAt.y;
  pointerDownAt = null;
  if (dx * dx + dy * dy < 36) handlePointerClick(e.clientX, e.clientY); // ignore drags (orbiting)
});

const ENGINE = 17;
const BRAKE = 14;
const IDLE_DRAG = 1.2;
const MAX_SPEED = 13;      // ~47 km/h: brisk, but you can still read the frames
const TURBO_ENGINE = 42;
const TURBO_MAX_SPEED = 32;
let steer = 0;

// ── HUD ─────────────────────────────────────────────────────────────────────
const capEl = document.getElementById('caption');
const capDate = capEl.querySelector('.date');
const capText = capEl.querySelector('.text');
let shownFrame = null;

// Nearest frame within pull-up range, or null — shared by the caption panel
// and the auto-look camera below, so both agree on which post you're at.
function nearestFrame(carPos) {
  let best = null, bestD = Infinity;
  for (const f of frames) {
    const d = carPos.distanceTo(f.world);
    if (d < bestD) { bestD = d; best = f; }
  }
  return bestD < 13 ? best : null;
}

function applyCaption(near) {
  if (near !== shownFrame) {
    shownFrame = near;
    if (near) {
      capDate.textContent = near.date;
      capText.textContent = near.caption;
      capEl.classList.add('show');
    } else {
      capEl.classList.remove('show');
    }
  }
}

// ── Camera follow ───────────────────────────────────────────────────────────
// Move the camera by however far the target moved, so it trails the car without
// fighting the user's own orbiting. When a frame is nearby and the user hasn't
// just been dragging, the orbit target eases toward it instead of the car, so
// you don't have to manually drag to look at each post.
let userDragging = false;
let dragEndedAt = -Infinity;
controls.addEventListener('start', () => { userDragging = true; });
controls.addEventListener('end', () => { userDragging = false; dragEndedAt = performance.now(); });

const camTarget = new THREE.Vector3().copy(START);
controls.target.copy(camTarget);
camera.position.set(START.x, START.y + 5, START.z - 11);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Loop ────────────────────────────────────────────────────────────────────
const carPos = new THREE.Vector3();
const carUp = new THREE.Vector3();
const clock = new THREE.Clock();
const BASE_FOV = camera.fov;
let turboVisual = 0; // eases toward 1 while boosting, back to 0 when released

// Auto-reset if the car ends up on its roof — a brief tilt during a hard
// landing shouldn't trigger it, so it only fires after staying flipped.
const FLIP_UP_THRESHOLD = -0.25;
const FLIP_RESET_DELAY = 1200; // ms
let flipSince = null;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Controls
  const fwd = keys.KeyW || keys.ArrowUp;
  const rev = keys.KeyS || keys.ArrowDown;
  const lft = keys.KeyA || keys.ArrowLeft;
  const rgt = keys.KeyD || keys.ArrowRight;
  const turbo = keys.ShiftLeft || keys.ShiftRight || keys.Turbo;
  if (keys.KeyR) { resetCar(); keys.KeyR = false; }

  const engineForce = turbo ? TURBO_ENGINE : ENGINE;
  const maxSpeed = turbo ? TURBO_MAX_SPEED : MAX_SPEED;
  const speed = Math.abs(vehicle.currentVehicleSpeed());
  // Cut the throttle at the cap rather than letting it run away
  const capped = speed > maxSpeed;
  // Throttle: keys are all-or-nothing, the joystick is proportional to how far
  // it is pushed (pushing up on screen is -Y, which is forward).
  const keyThrottle = fwd ? 1 : rev ? -0.55 : 0;
  const stickThrottle = -stickY * (stickY > 0 ? 0.55 : 1);
  const throttle = keyThrottle !== 0 ? keyThrottle : stickThrottle;
  const engine = capped ? 0 : engineForce * throttle;
  // Tighten the lock at speed so it stays composed instead of spinning out
  const maxSteer = THREE.MathUtils.lerp(0.58, 0.2, THREE.MathUtils.clamp(speed / 14, 0, 1));
  const keySteer = lft ? 1 : rgt ? -1 : 0;
  const wantSteer = maxSteer * (keySteer !== 0 ? keySteer : -stickX);
  steer += (wantSteer - steer) * 0.2;

  // Analog throttle rarely lands on exactly zero, so coast on a threshold
  const brake = keys.Space ? BRAKE : (Math.abs(engine) < 0.01 ? IDLE_DRAG : 0);
  for (let i = 0; i < 4; i++) {
    vehicle.setWheelEngineForce(i, engine);   // all four driven: forgiving to drive
    vehicle.setWheelBrake(i, brake);
  }
  vehicle.setWheelSteering(0, steer);
  vehicle.setWheelSteering(1, steer);

  vehicle.updateVehicle(world.timestep);
  world.step();

  // Turbo animation — twin exhaust flames flicker and grow, the car gets a
  // warm glow behind it, and the camera FOV punches out for a sense of speed
  // Gate on actual throttle, not the key — the joystick never sets `fwd`
  const boosting = turbo && throttle > 0.05;
  turboVisual += ((boosting ? 1 : 0) - turboVisual) * 0.15;
  if (turboVisual > 0.001) {
    const flicker = 0.82 + Math.sin(t * 46) * 0.18 + Math.sin(t * 97) * 0.06;
    for (const f of turboFlames) {
      if (!f.outer) continue; // flame model still loading
      f.outer.material.opacity = turboVisual * 0.8;
      f.inner.material.opacity = turboVisual * 0.95;
      const s = flicker * (0.35 + turboVisual * 0.65);
      f.group.scale.set(1, 1, Math.max(0.05, s));
    }
    turboLight.intensity = turboVisual * 2.2 * flicker;
  } else {
    for (const f of turboFlames) {
      if (!f.outer) continue;
      f.outer.material.opacity = 0;
      f.inner.material.opacity = 0;
    }
    turboLight.intensity = 0;
  }
  const targetFov = BASE_FOV + turboVisual * 9;
  if (Math.abs(camera.fov - targetFov) > 0.02) {
    camera.fov += (targetFov - camera.fov) * 0.15;
    camera.updateProjectionMatrix();
  }

  // Sync meshes
  const tr = chassisBody.translation();
  const rt = chassisBody.rotation();
  carBody.position.set(tr.x, tr.y, tr.z);
  carBody.quaternion.set(rt.x, rt.y, rt.z, rt.w);
  carPos.set(tr.x, tr.y, tr.z);

  // Flip detection — reset once the car has stayed upside-down for a beat
  carUp.set(0, 1, 0).applyQuaternion(carBody.quaternion);
  if (carUp.y < FLIP_UP_THRESHOLD) {
    if (flipSince === null) flipSince = performance.now();
    else if (performance.now() - flipSince > FLIP_RESET_DELAY) { resetCar(); flipSince = null; }
  } else {
    flipSince = null;
  }

  for (let i = 0; i < 4; i++) {
    const conn = vehicle.wheelChassisConnectionPointCs(i);
    const susp = vehicle.wheelSuspensionLength(i);
    const st = vehicle.wheelSteering(i) ?? 0;
    const spin = vehicle.wheelRotation(i) ?? 0;
    if (!conn) continue;
    wheelMeshes[i].position.set(conn.x, conn.y - (susp ?? WHEEL.rest), conn.z);
    wheelMeshes[i].rotation.set(spin, st, 0);
  }

  // Keep shadows crisp near the car rather than spread over the whole road
  sun.position.set(carPos.x + 14, 24, carPos.z + 10);
  sun.target.position.copy(carPos);
  sun.target.updateMatrixWorld();

  const near = nearestFrame(carPos);

  // Camera trails the car (user orbit preserved) — unless a photo zoom is
  // active or animating, in which case that takes over the camera instead.
  if (zoomAnim) {
    const k = easeInOutCubic(THREE.MathUtils.clamp((performance.now() - zoomAnim.start) / ZOOM_DUR, 0, 1));
    const to = zoomAnim.exiting
      ? { pos: carPos.clone().add(savedOffset), target: carPos }
      : zoomAnim.to;
    camera.position.lerpVectors(zoomAnim.from.pos, to.pos, k);
    controls.target.lerpVectors(zoomAnim.from.target, to.target, k);
    if (k >= 1) {
      if (zoomAnim.exiting) { controls.enabled = true; camTarget.copy(carPos); }
      zoomAnim = null;
    }
  } else if (!zoomedMesh) {
    const delta = carPos.clone().sub(camTarget);
    camera.position.add(delta);
    camTarget.copy(carPos);
    // Ease the orbit target toward a nearby post instead of the car, so you
    // don't have to manually drag to look at it — unless the user is (or just
    // was) dragging themselves, which always wins.
    const autoLookOK = !userDragging && performance.now() - dragEndedAt > 1200;
    const desiredTarget = near && autoLookOK ? near.world : camTarget;
    controls.target.lerp(desiredTarget, 0.05);
  }
  controls.update();

  applyCaption(near);

  // Petals
  for (const p of petals) {
    p.y -= p.vy * 0.016;
    if (p.y < -1) {
      p.y = rnd(18, 28);
      p.x = carPos.x + rnd(-55, 55);
      p.z = carPos.z + rnd(-55, 55);
    }
    p.mesh.position.set(p.x + Math.sin(t * 0.7 + p.sway) * 1.4, p.y, p.z);
    p.mesh.rotation.set(t * p.spin, t * p.spin * 0.6, t * p.spin * 0.3);
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
